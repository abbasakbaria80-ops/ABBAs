services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "const http=require('http');const r=http.get('http://localhost:5173/',res=>{process.exit(res.statusCode<400?0:1)});r.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

volumes:
  node_modules:
